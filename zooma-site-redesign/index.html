<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b10">
  <meta name="description" content="ZOOMA — новый независимый redesign исходного casino lobby">
  <title>ZOOMA — Rebuilt</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#view">К содержимому</a>

  <div class="app">
    <header class="command-bar">
      <a class="wordmark route-link" href="#/casino" data-route="casino" aria-label="ZOOMA — Casino">
        <span class="wordmark-orb" aria-hidden="true"></span><b>ZOOMA</b>
      </a>

      <nav class="command-nav" aria-label="Основные разделы">
        <a class="route-link" href="#/casino" data-route="casino">Casino</a>
        <a class="route-link" href="#/wheel" data-route="wheel">Wheel</a>
        <a class="route-link" href="#/mines" data-route="mines">Mines</a>
        <a class="route-link" href="#/classic" data-route="classic">Classic</a>
        <a class="route-link" href="#/duels" data-route="duels">Duels</a>
        <a class="route-link" href="#/trains" data-route="trains">Trains</a>
      </nav>

      <div class="command-actions">
        <button class="icon-action" id="openSearch" type="button" aria-label="Открыть поиск">⌕</button>
        <a class="event-pill route-link" href="#/tournaments" data-route="tournaments"><span></span> Events</a>
        <button class="avatar-action" id="openAccount" type="button" aria-label="Открыть аккаунт">Z</button>
      </div>
    </header>

    <div class="subnav-wrap">
      <nav class="subnav" aria-label="Сервисные разделы">
        <a class="route-link" href="#/promo" data-route="promo">Промокод</a>
        <a class="route-link" href="#/history" data-route="history">История</a>
        <a class="route-link" href="#/help" data-route="help">FAQ</a>
        <button type="button" id="providerQuick">Провайдеры</button>
      </nav>
      <div class="status-line"><span class="live-dot"></span><b id="routeLabel">CASINO</b><small>interactive prototype</small></div>
    </div>

    <main id="view" tabindex="-1"></main>

    <footer class="footer">
      <div><b>ZOOMA</b><p>Новый интерфейс, собранный с нуля по структуре исходного продукта.</p></div>
      <nav aria-label="Документы">
        <button type="button" data-doc="AML Policy">AML</button>
        <button type="button" data-doc="KYC Policy">KYC</button>
        <button type="button" data-doc="Terms & Conditions">Terms</button>
        <button type="button" data-doc="Responsible Gambling">Responsible Play</button>
      </nav>
      <div class="footer-meta"><span>18+</span><small>UI prototype · 2026</small></div>
    </footer>
  </div>

  <nav class="mobile-dock" aria-label="Мобильная навигация">
    <a class="route-link" href="#/casino" data-route="casino"><span>◉</span><small>Casino</small></a>
    <button id="mobileExplore" type="button"><span>◆</span><small>Explore</small></button>
    <button id="mobileSearch" class="dock-main" type="button"><span>⌕</span><small>Search</small></button>
    <a class="route-link" href="#/tournaments" data-route="tournaments"><span>✦</span><small>Events</small></a>
    <button id="mobileAccount" type="button"><span>◎</span><small>Account</small></button>
  </nav>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-backdrop" type="button" data-drawer-close aria-label="Закрыть"></button>
    <section class="drawer-panel" id="drawerPanel" aria-live="polite"></section>
  </aside>

  <div class="palette" id="palette" aria-hidden="true">
    <button class="palette-backdrop" type="button" data-palette-close aria-label="Закрыть поиск"></button>
    <section class="palette-card" role="dialog" aria-modal="true" aria-labelledby="paletteTitle">
      <div class="palette-head"><div><small>GLOBAL SEARCH</small><h2 id="paletteTitle">Что открыть?</h2></div><button class="icon-action" type="button" data-palette-close>×</button></div>
      <label class="palette-input"><span>⌕</span><input id="paletteInput" type="search" placeholder="Игра, провайдер или раздел…" autocomplete="off"><kbd>ESC</kbd></label>
      <div class="palette-results" id="paletteResults"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
