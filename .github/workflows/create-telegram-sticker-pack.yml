name: Create Telegram sticker pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - telegram-stickers-90/telegram-stickers-90-v2.zip
      - .github/workflows/create-telegram-sticker-pack.yml

permissions:
  contents: read

jobs:
  create-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Check required secrets and archive
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Missing repository Actions secret: TELEGRAM_BOT_TOKEN" >&2
            exit 1
          fi
          if [ -z "$TELEGRAM_USER_ID" ]; then
            echo "Missing repository Actions secret: TELEGRAM_USER_ID" >&2
            exit 1
          fi
          if [ ! -f telegram-stickers-90/telegram-stickers-90-v2.zip ]; then
            echo "Missing telegram-stickers-90/telegram-stickers-90-v2.zip" >&2
            exit 1
          fi

      - name: Create or resume Telegram sticker pack
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          python telegram-stickers-90/create_telegram_pack.py \
            --archive telegram-stickers-90/telegram-stickers-90-v2.zip \
            --title "Bunnies 90" \
            --slug "bunnies_90" \
            --emoji "🐰"

      - name: Show result
        if: success()
        run: |
          echo "Sticker pack: ${{ steps.telegram.outputs.pack_url }}"
